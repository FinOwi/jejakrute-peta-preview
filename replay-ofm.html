<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Demo Replay Berkendara — OpenFreeMap · JEJAKRUTE</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#17191C;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  #map{position:absolute;inset:0}
  .maplibregl-ctrl-attrib{font-size:9px}
  .chip{position:absolute;z-index:5;background:rgba(23,25,28,.92);color:#E8F5EF;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.35)}
  #judul{top:12px;left:12px;padding:10px 14px;max-width:min(78vw,340px)}
  #judul b{font-size:14px;letter-spacing:.4px}
  #judul b span{color:#17CE8F}
  #judul small{display:block;margin-top:2px;font-size:11px;color:#9DB4AA;line-height:1.45}
  #status{top:12px;right:12px;padding:6px 10px;font-size:11px;color:#9DB4AA;border-radius:999px}
  #status.ok{color:#17CE8F}
  #status.err{color:#FF7A6B}
  #panel{left:50%;transform:translateX(-50%);bottom:14px;width:min(94vw,430px);padding:12px 14px 10px}
  #stats{display:flex;gap:16px;align-items:baseline;margin-bottom:8px}
  #stats .km{font-size:20px;font-weight:700;color:#fff}
  #stats .km small{font-size:11px;color:#9DB4AA;font-weight:400}
  #stats .spd{margin-left:auto;font-size:12px;color:#9DB4AA}
  #stats .spd b{color:#17CE8F;font-size:14px}
  input[type=range]{width:100%;accent-color:#17CE8F;margin:2px 0 8px}
  .row{display:flex;gap:8px;align-items:center}
  button{background:#23262B;color:#E8F5EF;border:1px solid #34383F;border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer}
  button.aktif{background:#17CE8F;color:#0B1B12;border-color:#17CE8F;font-weight:700}
  #btnMain{flex:0 0 auto;min-width:96px}
  .grup{display:flex;gap:4px;margin-left:auto}
  .grup button{padding:7px 10px;font-size:12px}
  #penanda{width:88px;height:88px;pointer-events:none}
  #penanda img{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 7px rgba(0,0,0,.5))}
</style>
</head>
<body>
<div id="map"></div>

<div class="chip" id="judul">
  <b>JEJAK<span>RUTE</span> · Demo Replay Berkendara</b>
  <small>Basemap OpenFreeMap (OpenStreetMap) + gedung 3D, kamera miring mengikuti rute. Contoh rute: putaran Lapangan Merdeka – Kesawan, Medan (9,6 km, geometri jalan asli).</small>
</div>
<div class="chip" id="status">menyiapkan…</div>

<div class="chip" id="panel">
  <div id="stats">
    <div class="km"><span id="jarakTempuh">0,00</span> <small>/ 9,59 km</small></div>
    <div class="spd">kecepatan animasi <b id="labelKec">1×</b></div>
  </div>
  <input type="range" id="geser" min="0" max="1000" value="0">
  <div class="row">
    <button id="btnMain" class="aktif">⏸ Jeda</button>
    <button id="btnKamera" class="aktif">Kamera: Ikuti</button>
    <button id="btnMiring" class="aktif">3D</button>
    <div class="grup">
      <button data-kec="0.5">0,5×</button>
      <button data-kec="1" class="aktif">1×</button>
      <button data-kec="2">2×</button>
    </div>
  </div>
</div>

  window.__galat = [];

    var s = document.getElementById('status');
    if (s) { s.textContent = '⚠ ' + (e.message || 'galat tak dikenal'); s.className = 'chip err'; }
  });
  function __muatCadangan() {
    if (window.maplibregl) return;
    document.write('<script src="https:\/\/unpkg.com\/maplibre-gl@5\/dist\/maplibre-gl.js"><\/script>');
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js" onerror="__muatCadangan()"></script>

282,3.58434],[98.67283,3.58461],[98.67283,3.58466],[98.67283,3.58473],[98.67284,3.58486],[98.67285,3.585],[98.67287,3.5855],[98.67287,3.58557],[98.67288,3.58578],[98.6729,3.58603],[98.67291,3.58612],[98.67294,3.58669],[98.67296,3.58688],[98.67298,3.58704],[98.67301,3.58733],[98.67304,3.58787],[98.67305,3.58797],[98.67305,3.58808],[98.67305,3.58828],[98.67307,3.58852],[98.67309,3.58913],[98.67311,3.5894],[98.67313,3.58949],[98.67317,3.5896],[98.6732,3.58968],[98.67332,3.58967],[98.67368,3.58964],[98.67382,3.58964],[98.67437,3.58967],[98.67475,3.58974],[98.67494,3.58976],[98.67502,3.58977],[98.67511,3.58973],[98.67516,3.58973],[98.67567,3.58977],[98.6757,3.58977],[98.67628,3.58986],[98.6771,3.58999],[98.67739,3.59004],[98.67747,3.59006],[98.6775,3.59007],[98.6777,3.59014],[98.6775,3.59064],[98.67747,3.59074],[98.67744,3.59081],[98.67738,3.59098],[98.67733,3.59102],[98.67731,3.59104],[98.67729,3.59107],[98.67728,3.5911],[98.67725,3.59117],[98.67715,3.59145],[98.67712,3.59152],[98.67696,3.59194],[98.67687,3.59221],[98.67685,3.59226],[98.67685,3.59232],[98.67684,3.59239],[98.67666,3.59285],[98.67638,3.59278],[98.6763,3.59278],[98.67602,3.59268],[98.67597,3.59266],[98.67581,3.59259],[98.67579,3.59259],[98.67574,3.59256],[98.67565,3.59252],[98.67457,3.59217],[98.67449,3.59243]];
  var MINT = '#17CE8F';
  var DURASI_DASAR = 55; // detik untuk satu putaran penuh pada 1x

  // --- geometri: jarak kumulatif + interpolasi ---
  function hav(a, b) {
    var R = 6371000, p1 = a[1] * Math.PI / 180, p2 = b[1] * Math.PI / 180;
    var dp = p2 - p1, dl = (b[0] - a[0]) * Math.PI / 180;
    var h = Math.sin(dp / 2) * Math.sin(dp / 2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) * Math.sin(dl / 2);
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  var kum = [0];
  for (var i = 1; i < RUTE.length; i++) kum.push(kum[i - 1] + hav(RUTE[i - 1], RUTE[i]));
  var TOTAL = kum[kum.length - 1];

  function posisiPada(d) {
    d = Math.max(0, Math.min(TOTAL, d));
    var lo = 0, hi = kum.length - 1;
    while (lo < hi - 1) { var mid = (lo + hi) >> 1; if (kum[mid] <= d) lo = mid; else hi = mid; }
    var seg = kum[hi] - kum[lo] || 1, t = (d - kum[lo]) / seg;
    var a = RUTE[lo], b = RUTE[hi];
    return {
      lngLat: [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t],
      bearing: Math.atan2(b[0] - a[0], b[1] - a[1]) * 180 / Math.PI
    };
  }
  function potongRute(d) {
    var pts = [], k;
    for (k = 0; k < RUTE.length; k++) { if (kum[k] <= d) pts.push(RUTE[k]); else break; }
    pts.push(posisiPada(d).lngLat);
    return pts;
  }

  setStatus('memuat peta…');
  var map = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/liberty',
    center: RUTE[0], zoom: 16.6, pitch: 58, bearing: 0,
    attributionControl: { compact: true }
  });
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');

  // penanda: sprite motor adventure (aset prototipe Kesawan) —
  // gambar menghadap ke atas = arah bearing 0, jadi rotasi marker
  // mengikuti bearing perjalanan persis seperti panah sebelumnya.
  var el = document.createElement('div');
  el.id = 'penanda';
  el.innerHTML = '<img src="aset-motor.png" alt="">';
  var marker = new maplibregl.Marker({ element: el, rotationAlignment: 'map', pitchAlignment: 'map' })
    .setLngLat(RUTE[0]).addTo(map);

  var maju = true, ikuti = true, miring = true, kec = 1, jarak = 0, last = null;
  var elJarak = document.getElementById('jarakTempuh'), elGeser = document.getElementById('geser');
  var sumberProgres = { type: 'Feature', geometry: { type: 'LineString', coordinates: [RUTE[0], RUTE[0]] } };

  map.on('load', function () {
    map.addSource('rute-penuh', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: RUTE } } });
    map.addLayer({ id: 'rute-bayangan', type: 'line', source: 'rute-penuh', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#FFFFFF', 'line-width': 10, 'line-opacity': 0.85 } });
    map.addLayer({ id: 'rute-dasar', type: 'line', source: 'rute-penuh', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': MINT, 'line-width': 6, 'line-opacity': 0.30 } });
    map.addSource('rute-progres', { type: 'geojson', data: sumberProgres });
    map.addLayer({ id: 'rute-progres', type: 'line', source: 'rute-progres', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': MINT, 'line-width': 6 } });
    setStatus('peta siap ✓', 'ok');
    requestAnimationFrame(bingkai);
  });
  map.on('error', function (e) { setStatus('⚠ ' + ((e && e.error && e.error.message) || 'galat peta'), 'err'); });

  var bearingHalus = 0;
  function bingkai(ts) {
    if (last === null) last = ts;
    var dt = Math.min(0.05, (ts - last) / 1000); last = ts;
    if (maju) {
      jarak += (TOTAL / DURASI_DASAR) * kec * dt;
      if (jarak >= TOTAL) jarak = 0; // putar ulang
    }
    var p = posisiPada(jarak);
    marker.setLngLat(p.lngLat);
    marker.setRotation(p.bearing);
    var beda = ((p.bearing - bearingHalus + 540) % 360) - 180;
    bearingHalus += beda * 0.08;
    var src = map.getSource('rute-progres');
    if (src) src.setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: potongRute(jarak) } });
    if (ikuti) {
      map.jumpTo({ center: p.lngLat, bearing: bearingHalus, pitch: miring ? 58 : 0, zoom: 16.6 });
    }
    elJarak.textContent = (jarak / 1000).toFixed(2).replace('.', ',');
    if (document.activeElement !== elGeser) elGeser.value = Math.round(jarak / TOTAL * 1000);
    requestAnimationFrame(bingkai);
  }

  var btnMain = document.getElementById('btnMain');
  btnMain.addEventListener('click', function () {
    maju = !maju;
    btnMain.textContent = maju ? '⏸ Jeda' : '▶ Putar';
    btnMain.classList.toggle('aktif', maju);
  });
  document.getElementById('btnKamera').addEventListener('click', function () {
    ikuti = !ikuti;
    this.textContent = ikuti ? 'Kamera: Ikuti' : 'Kamera: Bebas';
    this.classList.toggle('aktif', ikuti);
    if (!ikuti) map.easeTo({ pitch: miring ? 58 : 0 });
  });
  document.getElementById('btnMiring').addEventListener('click', function () {
    miring = !miring;
    this.textContent = miring ? '3D' : '2D';
    this.classList.toggle('aktif', miring);
    if (!ikuti) map.easeTo({ pitch: miring ? 58 : 0 });
  });
  elGeser.addEventListener('input', function () { jarak = TOTAL * (Number(elGeser.value) / 1000); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-kec]'), function (b) {
    b.addEventListener('click', function () {
      kec = Number(b.getAttribute('data-kec'));
      document.getElementById('labelKec').textContent = String(kec).replace('.', ',') + '×';
      Array.prototype.forEach.call(document.querySelectorAll('[data-kec]'), function (x) { x.classList.toggle('aktif', x === b); });
    });
  });
})();
</script>
</body>
</html>
